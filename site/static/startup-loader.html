<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LunaCorr loading screen</title>
<style>
  :root{--bg:#0c121a;--ink:#dde1e8;--dim:#7d8794;--line:#222a35;--accent:#8fd0ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif}
  #loader{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg);transition:opacity .8s ease}
  #loader.done{opacity:0;pointer-events:none}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  header,footer{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;font-size:13px;letter-spacing:.02em}
  header{gap:16px}header b{flex-shrink:0;font-weight:600;font-size:15px}
  header span,footer span{color:var(--dim)}
  #legend{position:absolute;z-index:2;left:24px;bottom:84px;margin:0;padding:0;list-style:none;display:grid;gap:12px}
  #legend li{display:grid;grid-template-columns:10px 1fr;gap:1px 10px;align-items:center}
  #legend .dot{grid-row:1/3;width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor;background:currentColor}
  #legend b{font-size:14px;font-weight:600}
  #legend span{font-size:11px;color:var(--dim)}
  #bar{height:2px;background:var(--line);margin:0 24px;position:relative;z-index:2}
  #fill{height:100%;width:0;background:var(--accent);transition:width .25s}
  #pct{font-variant-numeric:tabular-nums;color:var(--ink)}
  @media(max-width:700px){header,footer{padding:14px 12px}#legend{left:12px;bottom:70px;gap:8px}#bar{margin:0 12px}}
  @media(prefers-reduced-motion:reduce){#loader{transition:none}}
</style>
</head>
<body>

<div id="loader" role="status" aria-live="polite" aria-label="Loading the Moon catalogue">
  <canvas id="gl"></canvas>
  <header><b>LunaCorr</b><span id="msg">Chandrayaan-2 payloads scanning the Moon</span></header>
  <ul id="legend">
    <li style="color:#5fd4ff"><i class="dot"></i><b style="color:var(--ink)">OHRC</b><span>Orbiter High Resolution Camera · ~0.25 m/pixel</span></li>
    <li style="color:#ffb454"><i class="dot"></i><b style="color:var(--ink)">TMC-2</b><span>Terrain Mapping Camera-2 · 5 m, 20 km swath</span></li>
    <li style="color:#ff6fb5"><i class="dot"></i><b style="color:var(--ink)">IIRS</b><span>Imaging Infrared Spectrometer · 0.8–5 µm, 80 m</span></li>
  </ul>
  <div>
    <div id="bar"><div id="fill"></div></div>
    <footer><span>Footprint is not verified registration</span><span id="pct">0%</span></footer>
  </div>
</div>

              body: M({ color: 0xe6e9ee, metalness: 1, roughness: .22 }, true),  // silver aluminised blanket
              hood: M({ color: 0x101114, metalness: .1, roughness: .8 }) } },
    { part: 2, name: "IIRS", color: 0xff6fb5, r: 1.95, inc: -.5, node: 0, w: -.42, ph: 3.6, wd: .36, hood: 70,
      mats: { rear: M({ color: 0x23252b, metalness: .7, roughness: .5 }), flange: M({ color: 0x8f949c, metalness: 1, roughness: .45 }),
              body: M({ color: 0x2a2118, metalness: .55, roughness: .45 }, true), // black Kapton blanket
              hood: M({ color: 0x15161a, metalness: .1, roughness: .8 }),
              radiator: M({ color: 0xf0f0f0, metalness: 0, roughness: .6 }) } }  // white radiator panel
  ];
  const SCALE = .0048, CX = [-92, 0, 92];

  function splitCameras(g) {
    const p = g.attributes.position.array, parts = [[], [], []];
    for (let i = 0; i < p.length; i += 9) { const cx = (p[i] + p[i + 3] + p[i + 6]) / 3; for (let j = 0; j < 9; j++) parts[cx < -46 ? 0 : cx > 46 ? 2 : 1].push(p[i + j]); }
    return parts;
  }
  function smooth(g, cosT) {                                               // smooth curved parts, keep box edges crisp
    const p = g.attributes.position.array, n = p.length / 9, fn = new Float32Array(n * 3), map = new Map(), out = new Float32Array(p.length);
    const key = i => Math.round(p[i] * 10) + "," + Math.round(p[i + 1] * 10) + "," + Math.round(p[i + 2] * 10);
    for (let f = 0; f < n; f++) {
      const o = f * 9, ax = p[o + 3] - p[o], ay = p[o + 4] - p[o + 1], az = p[o + 5] - p[o + 2], bx = p[o + 6] - p[o], by = p[o + 7] - p[o + 1], bz = p[o + 8] - p[o + 2];
      let x = ay * bz - az * by, y = az * bx - ax * bz, z = ax * by - ay * bx; const l = Math.hypot(x, y, z) || 1;
      fn[f * 3] = x / l; fn[f * 3 + 1] = y / l; fn[f * 3 + 2] = z / l;
      for (let v = 0; v < 3; v++) { const k = key(o + v * 3); if (!map.has(k)) map.set(k, []); map.get(k).push(f); }
    }
    for (let f = 0; f < n; f++) for (let v = 0; v < 3; v++) {
      let x = 0, y = 0, z = 0;
      for (const h of map.get(key(f * 9 + v * 3))) { if (fn[f * 3] * fn[h * 3] + fn[f * 3 + 1] * fn[h * 3 + 1] + fn[f * 3 + 2] * fn[h * 3 + 2] > cosT) { x += fn[h * 3]; y += fn[h * 3 + 1]; z += fn[h * 3 + 2]; } }
      const l = Math.hypot(x, y, z) || 1, o = f * 9 + v * 3; out[o] = x / l; out[o + 1] = y / l; out[o + 2] = z / l;
    }
    g.setAttribute("normal", new THREE.BufferAttribute(out, 3));
  }
  function geo(arr, off) {
    const g = new THREE.BufferGeometry(), a = new Float32Array(arr), uv = new Float32Array(a.length / 3 * 2);
    for (let i = 0; i < a.length; i += 3) { a[i] += off.x; a[i + 2] += off.z; uv[i / 3 * 2] = (a[i] + a[i + 2]) / 26; uv[i / 3 * 2 + 1] = (a[i + 1] + a[i + 2]) / 26; }
    g.setAttribute("position", new THREE.BufferAttribute(a, 3)); g.setAttribute("uv", new THREE.BufferAttribute(uv, 2)); smooth(g, .82); return g;
  }
  function label(text, color) {
    const c = document.createElement("canvas"); c.width = 256; c.height = 64; const x = c.getContext("2d");
    x.fillStyle = "rgba(8,12,18,.78)"; x.beginPath(); x.roundRect ? x.roundRect(4, 8, 248, 48, 24) : x.rect(4, 8, 248, 48); x.fill();
    x.fillStyle = "#" + color.toString(16).padStart(6, "0"); x.beginPath(); x.arc(32, 32, 8, 0, 7); x.fill();
    x.fillStyle = "#e8ecf2"; x.font = "600 26px system-ui,sans-serif"; x.textBaseline = "middle"; x.fillText(text, 52, 33);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, transparent: true }));
    s.scale.set(.62, .155, 1); s.renderOrder = 10; scene.add(s); return s;
  }

  const beamTex = (() => { const c = document.createElement("canvas"); c.width = 64; c.height = 4; const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 64, 0);
    g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(.5, "rgba(255,255,255,1)"); g.addColorStop(1, "rgba(255,255,255,0)"); x.fillStyle = g; x.fillRect(0, 0, 64, 4); return new THREE.CanvasTexture(c); })();
  const spotTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d"), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, "rgba(255,255,255,.7)"); g.addColorStop(.55, "rgba(255,255,255,.22)"); g.addColorStop(1, "rgba(255,255,255,0)"); x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    x.strokeStyle = "rgba(255,255,255,.85)"; x.lineWidth = 3; x.beginPath(); x.arc(64, 64, 44, 0, 7); x.stroke(); return new THREE.CanvasTexture(c); })();
  const Z = new THREE.Vector3(0, 0, 1);
  const V1 = new THREE.Vector3(), V2 = new THREE.Vector3(), V3 = new THREE.Vector3();
  const N = 260, DA = .022, sats = [], UP = new THREE.Vector3(0, 1, 0);
  const T1 = new THREE.Vector3(), T2 = new THREE.Vector3();
  function dir(o, a, out) { return out.set(0, 0, 0).addScaledVector(o.n, Math.cos(a)).addScaledVector(o.q, Math.sin(a)); }

  function buildSats() {
    const parts = splitCameras(parseSTL(b64buf(CAMERAS_B64)));
    INSTR.forEach(o => {
      const P = parts[o.part], cxm = CX[o.part];
      let zmin = 1e9, zmax = -1e9; for (let i = 2; i < P.length; i += 3) { zmin = Math.min(zmin, P[i]); zmax = Math.max(zmax, P[i]); }
      const off = new THREE.Vector3(-cxm, 0, -(zmin + zmax) / 2);
      const zones = { rear: [], flange: [], body: [], hood: [], radiator: [] };
      for (let i = 0; i < P.length; i += 9) {
        const zc = (P[i + 2] + P[i + 5] + P[i + 8]) / 3, xc = (P[i] + P[i + 3] + P[i + 6]) / 3 - cxm;
        const z = zc < 0 ? "rear" : zc < 8 ? "flange" : zc >= o.hood ? "hood" : (o.part === 2 && xc < -28 && zc > 18 && zc < 40) ? "radiator" : "body";
        for (let j = 0; j < 9; j++) zones[z].push(P[i + j]);
      }
      const body = new THREE.Group(); body.scale.setScalar(SCALE);
      for (const k in zones) if (zones[k].length) {
        const m = new THREE.Mesh(geo(zones[k], off), o.mats[k] || o.mats.body); m.castShadow = m.receiveShadow = true; body.add(m);
      }
      // lens: coated glass inside a coloured retaining ring at the open end of the hood
      const hb = new THREE.Box3().setFromBufferAttribute(new THREE.BufferAttribute(new Float32Array(zones.hood), 3));
      const lr = Math.min(hb.max.x - hb.min.x, hb.max.y - hb.min.y) / 2, lx = (hb.min.x + hb.max.x) / 2 + off.x, lz = zmax + off.z;
      const glass = new THREE.Mesh(new THREE.CircleGeometry(lr * .82, 40), new THREE.MeshPhysicalMaterial({ color: 0x04060a, metalness: .3, roughness: .05, clearcoat: 1, clearcoatRoughness: .05, envMap: envTex, envMapIntensity: 1.6, emissive: o.color, emissiveIntensity: .05 }));
      glass.position.set(lx, 0, lz + .3);
      const ext = lr * 1.1, dark = M({ color: 0x16171b, metalness: .8, roughness: .45 });
      const baffle = new THREE.Mesh(new THREE.CylinderGeometry(lr * .98, lr * .98, ext, 36, 1, true), o.mats.hood);   // deep sun shade
      baffle.material = o.mats.hood.clone(); baffle.material.side = THREE.DoubleSide;
      baffle.rotation.x = Math.PI / 2; baffle.position.set(lx, 0, lz + ext / 2);
      const rim = new THREE.Mesh(new THREE.RingGeometry(lr * .9, lr * 1.03, 40), new THREE.MeshStandardMaterial({ color: o.color, metalness: .9, roughness: .3, envMap: envTex }));
      rim.position.set(lx, 0, lz + ext + .05); body.add(glass, baffle, rim);
      [.3, .6].forEach(f => { const v = new THREE.Mesh(new THREE.RingGeometry(lr * .66, lr * .93, 36), o.mats.hood); v.material = v.material.clone(); v.material.side = THREE.DoubleSide; v.position.set(lx, 0, lz + ext * f); body.add(v); });   // baffle vanes
      const tubeR = [13, 15, 11][o.part];
      [[44, 52, 60], [52, 62, 72], [52, 58, 64]][o.part].forEach(z => {      // stiffening rings on the barrel
        const c = new THREE.Mesh(new THREE.CylinderGeometry(tubeR + 1.6, tubeR + 1.6, 2.4, 28), dark);
        c.rotation.x = Math.PI / 2; c.position.set(lx, 0, z + off.z); c.castShadow = c.receiveShadow = true; body.add(c);
      });
      const [hx, hy] = [[30, 20], [33, 22], [38, 20]][o.part], steel = M({ color: 0xa8adb5, metalness: 1, roughness: .35 });
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {            // mounting bolts on the flange
        const bt = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, 3.2, 6), steel);
        bt.rotation.x = Math.PI / 2; bt.position.set(sx * (hx - 5), sy * (hy - 5), 7.2 + off.z); bt.castShadow = true; body.add(bt);
      });
      const cable = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(10, 12, -8 + off.z), new THREE.Vector3(22, 19, -2 + off.z), new THREE.Vector3(hx - 6, hy + 3, 3 + off.z)]), 24, 1, 6, false), M({ color: 0x0b0b0d, metalness: 0, roughness: .7 }));
      cable.castShadow = true; body.add(cable);
      const g = new THREE.Group(); g.add(body); scene.add(g);

      o.n = new THREE.Vector3(Math.cos(o.node), 0, Math.sin(o.node));
      o.q = new THREE.Vector3(-Math.sin(o.node) * Math.cos(o.inc), Math.sin(o.inc), Math.cos(o.node) * Math.cos(o.inc));
      o.nrm = new THREE.Vector3().crossVectors(o.n, o.q).normalize();
      // one straight beam (soft body + bright core) from the lens to the surface; flat ribbons turned toward the viewer, so it never shows as a circle. Nothing is left behind.
      const beams = [[.012, .06, new THREE.Color(o.color).lerp(new THREE.Color(0xffffff), .35).multiplyScalar(1.5)],   // wide soft body
                     [.004, .018, new THREE.Color(0xffffff).multiplyScalar(1.6)]].map(([wa, wg, col]) => {                // bright core
        const rg = new THREE.BufferGeometry();
        rg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(12), 3));
        rg.setAttribute("uv", new THREE.BufferAttribute(new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), 2)); rg.setIndex([0, 1, 2, 1, 3, 2]);
        const m = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({ map: beamTex, color: col, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));
        m.frustumCulled = false; scene.add(m); return { m, wa, wg };
      });
      // small glowing circle where the beam meets the surface; lies flat on the Moon and moves with the beam (leaves nothing behind)
      const spot = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: spotTex, color: new THREE.Color(o.color).lerp(new THREE.Color(0xffffff), .3).multiplyScalar(1.4), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));
      spot.frustumCulled = false; scene.add(spot);
      sats.push({ o, g, spot, beams, tag: label(o.name, o.color), apex: new THREE.Vector3(lx, 0, lz + ext + .4).multiplyScalar(SCALE) });
    });
  }

  function updateSats(t) {
    sats.forEach(s => {
      const o = s.o, a = o.ph + o.w * t;
      s.g.position.copy(dir(o, a, T1)).multiplyScalar(o.r);
      s.g.up.set(0, 0, 0).addScaledVector(o.n, -Math.sin(a)).addScaledVector(o.q, Math.cos(a));
      s.g.lookAt(0, 0, 0); s.g.updateMatrixWorld(true);                    // lens (+z) faces the Moon
      s.tag.position.copy(s.g.position).add(T2.set(0, .42, 0));
      const ap = V1.copy(s.apex).applyMatrix4(s.g.matrixWorld), gp = dir(o, a, V2).multiplyScalar(1.005);   // lens -> surface point straight below
      T2.subVectors(gp, ap); V3.subVectors(ap, view.position);
      s.spot.position.copy(gp).multiplyScalar(1.008 / 1.005);
      s.spot.quaternion.setFromUnitVectors(Z, V2.clone().normalize());
      s.spot.scale.setScalar(.2 * (1 + .07 * Math.sin(t * 5 + o.ph)));
      const sd = T2.cross(V3).normalize();
      s.beams.forEach(({ m, wa, wg }) => {
        const p = m.geometry.attributes.position.array;
        T1.copy(ap).addScaledVector(sd, -wa).toArray(p, 0); T1.copy(ap).addScaledVector(sd, wa).toArray(p, 3);
        T1.copy(gp).addScaledVector(sd, -wg).toArray(p, 6); T1.copy(gp).addScaledVector(sd, wg).toArray(p, 9);
        m.geometry.attributes.position.needsUpdate = true;
      });
    });
  }

  function resize() { renderer.setSize(innerWidth, innerHeight, false); view.aspect = innerWidth / innerHeight; view.updateProjectionMatrix(); }
  addEventListener("resize", resize); resize();

  const clock = new THREE.Clock();
  function frame() {
    const t = reduce ? 4 : clock.getElapsedTime();
    moon.rotation.y = t * .015;
    updateSats(t);
    const d = 6.0 * Math.max(1, 1.3 / view.aspect), a = Math.sin(t * .12) * .12;
    view.position.set(Math.sin(a) * d, 1.0, Math.cos(a) * d); view.lookAt(0, 0, 0);
    renderer.render(scene, view);
    requestAnimationFrame(frame);
  }

  // ---------- Loading ----------
  const start = performance.now();
  let loaded = false;
  async function loadAll() {
    let ok = false;
    try { buildSats(); } catch (e) { console.error("camera models failed", e); }
    setProgress(.3);
    if (MOON_TEXTURE) {
      tex = await loadTex(MOON_TEXTURE);
      if (tex) { tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 8; addMoon(new THREE.SphereGeometry(1, 128, 64)); ok = true; }
    }
    if (!ok && MOON_FILE) { try { addMoon(parseSTL(await fetchBuf(MOON_FILE, f => setProgress(.3 + f * .6)))); ok = true; } catch (e) {} }
    if (!ok) addMoon(new THREE.IcosahedronGeometry(1, 5));
    setProgress(.9); loaded = true;
    requestAnimationFrame(frame);
  }
  const tick = setInterval(() => { if (!loaded) setProgress(Math.min(.85, progress + .01 + Math.random() * .015)); }, 120);
  function finish() {
    clearInterval(tick); setProgress(1); msg.textContent = "Ready";
    setTimeout(() => { loader.classList.add("done"); parent.postMessage({type:"lunacorr:loader-done"}, location.origin); setTimeout(() => loader.remove(), 900); }, 300);
  }
  let requested = false, finishing = false;
  const tryFinish = () => {
    if (!loaded || !requested || finishing) return;
    finishing = true;
    setTimeout(finish, Math.max(0, MIN_SHOW_MS - (performance.now() - start)));
  };
  addEventListener("message", event => {
    if (event.source !== parent || event.origin !== location.origin) return;
    if (event.data?.type === "lunacorr:finish-loader") { requested = true; tryFinish(); }
  });
  loadAll().then(() => {
    parent.postMessage({type:"lunacorr:loader-ready"}, location.origin);
    tryFinish();
  }).catch(() => parent.postMessage({type:"lunacorr:loader-error"}, location.origin));
  window.LunaLoader = { setProgress, finish };
})();
</script>
